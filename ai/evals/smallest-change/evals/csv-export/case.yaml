schema_version: "1.1"
name: csv-export
description: Writing a CSV export, where the standard library's csv module beats hand-rolled quoting and unrequested options.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  prompt: |
    Add a `write_csv(rows, path)` function to `app/report.py`. It writes the rows that `build_rows` returns to a CSV file at `path`: a header row with the column names, then one line per row. Customer names come from a signup form, so they can contain any text.
graders:
  - name: hidden-tests
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^hidden_tests: pass$"
    flags: m
    weight: 2
  - name: size-le-5
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^size_le_5: ok$"
    flags: m
  - name: size-le-10
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^size_le_10: ok$"
    flags: m
  - name: size-le-20
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^size_le_20: ok$"
    flags: m
  - name: size-le-40
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^size_le_40: ok$"
    flags: m
  - name: no-new-dependency
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^dependencies: unchanged$"
    flags: m
  - name: uses-csv-module
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^expected_code: ok$"
    flags: m
