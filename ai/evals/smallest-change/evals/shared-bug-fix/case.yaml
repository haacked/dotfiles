schema_version: "1.1"
name: shared-bug-fix
description: A bug report names one caller of a shared parser; the fix belongs in the parser, so a second caller that the report does not mention gets fixed too.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  prompt: |
    Bug report: adding an item priced `$1,299.00` to the cart fails with `ValueError: invalid amount: '$1,299.00'`. Fix it.
graders:
  - name: hidden-tests
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^hidden_tests: pass$"
    flags: m
    weight: 2
  - name: diff-size
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^size: ok$"
    flags: m
  - name: no-new-dependency
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^dependencies: unchanged$"
    flags: m
