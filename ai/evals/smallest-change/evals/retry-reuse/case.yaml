schema_version: "1.1"
name: retry-reuse
description: Adding retries to webhook delivery, where the codebase already has a retry helper and retry options or a backoff class are tempting.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  prompt: |
    Webhook endpoints sometimes answer with a 5xx status. Make `deliver` in `app/webhooks.py` retry a delivery that fails with `DeliveryError`, making at most 3 attempts in total.
graders:
  - name: hidden-tests
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^hidden_tests: pass$"
    flags: m
    weight: 2
  - name: size-le-5
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^size_le_5: ok$"
    flags: m
  - name: size-le-10
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^size_le_10: ok$"
    flags: m
  - name: size-le-20
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^size_le_20: ok$"
    flags: m
  - name: size-le-40
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^size_le_40: ok$"
    flags: m
  - name: no-new-dependency
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^dependencies: unchanged$"
    flags: m
  - name: reuses-retry-helper
    type: regex
    target: {source: file, path: eval-result.txt}
    pattern: "^expected_code: ok$"
    flags: m
