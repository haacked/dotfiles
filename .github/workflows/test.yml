name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest==8.4.2
      - name: Check portable skill copies
        run: ai/bin/sync-portable-skills.sh --check
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run tests
        run: script/test
